[project]
name = "caliper-api"
version = "0.1.0"
description = "Caliper project context and software-factory API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "cryptography>=44,<51",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pwdlib[argon2]>=0.3.1",
  "pydantic>=2.10,<3",
  "pyyaml>=6.0.3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<9", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caliper"]
