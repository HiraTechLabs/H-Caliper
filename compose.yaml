services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-caliper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
      POSTGRES_DB: ${POSTGRES_DB:-caliper}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: ./backend
    environment:
      CALIPER_DB_USER: ${POSTGRES_USER:-caliper}
      CALIPER_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
      CALIPER_DB_HOST: db
      CALIPER_DB_NAME: ${POSTGRES_DB:-caliper}
      CALIPER_SECRET_DATA_DIR: /var/lib/caliper/secret-data
      CALIPER_SECRET_KEYRING: /var/lib/caliper/keyring/keyring.json
      CALIPER_REPOSITORY_ROOT: /tmp/caliper-repositories
      CALIPER_LOCAL_REPOSITORY_ROOT: /var/lib/caliper/local-repositories
      CALIPER_ALLOW_LOCAL_REPOSITORIES: ${CALIPER_ALLOW_LOCAL_REPOSITORIES:-false}
      CALIPER_SSH_KNOWN_HOSTS: /etc/caliper/ssh/known_hosts
      OPENCODE_BASE_URL: http://127.0.0.1:4096
      XDG_DATA_HOME: /run/caliper-opencode/data
      XDG_CONFIG_HOME: /run/caliper-opencode/config
    volumes:
      - caliper-secret-data:/var/lib/caliper/secret-data
      - caliper-keyring:/var/lib/caliper/keyring
      - ./local-repositories:/var/lib/caliper/local-repositories:ro
      - ./config/ssh:/etc/caliper/ssh:ro
    tmpfs:
      - /run/caliper-opencode:uid=10001,gid=10001,mode=0700
    depends_on:
      db:
        condition: service_healthy
      secret-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  secret-init:
    build:
      context: ./backend
    command: ["python", "-m", "caliper.cli", "secrets", "init-keyring"]
    environment:
      CALIPER_SECRET_DATA_DIR: /var/lib/caliper/secret-data
      CALIPER_SECRET_KEYRING: /var/lib/caliper/keyring/keyring.json
    volumes:
      - caliper-secret-data:/var/lib/caliper/secret-data
      - caliper-keyring:/var/lib/caliper/keyring
    restart: "no"

  web:
    build:
      context: ./web
    expose:
      - "8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  proxy:
    image: caddy:2.11.7-alpine
    ports:
      - "${CALIPER_WEB_BIND:-127.0.0.1}:${CALIPER_WEB_PORT:-8443}:443"
    environment:
      CALIPER_SERVER_NAME: ${CALIPER_SERVER_NAME:-localhost}
    volumes:
      - ./web/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  db-test:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-caliper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
      POSTGRES_DB: caliper_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data

  integration-tests:
    build:
      context: ./backend
    profiles: ["test"]
    command: ["uv", "run", "--group", "dev", "pytest", "-q", "backend/tests"]
    volumes:
      - ./backend/tests:/app/backend/tests:ro
      - ./.caliper:/app/.caliper:ro
    tmpfs:
      - /run/caliper-opencode:uid=10001,gid=10001,mode=0700
    environment:
      CALIPER_DB_USER: ${POSTGRES_USER:-caliper}
      CALIPER_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
      CALIPER_DB_HOST: db-test
      CALIPER_DB_NAME: caliper_test
    depends_on:
      db-test:
        condition: service_healthy

  volume-archive:
    image: alpine:3.21
    profiles: ["maintenance"]
    entrypoint: ["sh", "-c"]
    command: ["sleep infinity"]
    volumes:
      - caliper-secret-data:/source/secret-data
      - caliper-keyring:/source/keyring
    restart: "no"

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
  caliper-secret-data:
  caliper-keyring:
